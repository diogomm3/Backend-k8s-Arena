---
name: CI Template (Reusable)

on:
  workflow_call:
    inputs:
      changed-backends:
        description: "JSON array of changed backend directories (e.g., ['python', 'go'])"
        required: false
        type: string
        default: '[]'
  workflow_dispatch:
    inputs:
      changed-backends:
        description: "JSON array of changed backend directories for testing (e.g. [\"python\", \"go\"])"
        required: false
        type: string
        default: '[]'

jobs:
  # This job determines which backends changed and outputs a matrix
  # It always runs, even with empty matrix, to avoid "no jobs" failure
  detect-changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-backends: ${{ steps.set-matrix.outputs.has-backends }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set matrix from input
        id: set-matrix
        run: |
          # Input is a JSON array like '["python", "go"]'
          # Convert to matrix format: {"include": [{"backend": "python"}, {"backend": "go"}]}
          BACKENDS='${{ inputs.changed-backends }}'
          if [ "$BACKENDS" = "[]" ] || [ -z "$BACKENDS" ]; then
            echo 'matrix={"include": []}' >> "$GITHUB_OUTPUT"
            echo 'has-backends=false' >> "$GITHUB_OUTPUT"
          else
            # Transform ["python", "go"] -> {"include": [{"backend": "python"}, {"backend": "go"}]}
            MATRIX=$(echo "$BACKENDS" | jq -c 'map({backend: .}) | {include: .}')
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo 'has-backends=true' >> "$GITHUB_OUTPUT"
          fi

  # Build and test each backend in the matrix
  # Only runs if matrix is non-empty (guard via boolean output)
  backend-ci:
    name: Backend CI (${{ matrix.backend }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has-backends == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Check backend directory exists
        id: check-backend
        run: |
          if [ -d "backends/${{ matrix.backend }}" ] && [ -f "backends/${{ matrix.backend }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Backend directory or Dockerfile not found for ${{ matrix.backend }} — skipping"
          fi
      - name: Set up Docker Buildx
        if: ${{ steps.check-backend.outputs.exists == 'true' }}
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1
      - name: Build backend image (multi-arch, no push)
        if: ${{ steps.check-backend.outputs.exists == 'true' }}
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0  # v5.3.0
        with:
          context: ./backends/${{ matrix.backend }}
          platforms: linux/amd64,linux/arm64
          load: true
          tags: backend-${{ matrix.backend }}:test
      - name: Start Postgres with small seed
        if: ${{ steps.check-backend.outputs.exists == 'true' }}
        run: |
          # TODO: Implement in T03/T04 - for now this is a placeholder
          echo "Postgres + small seed would start here"
          echo "Conformance suite would run against the built image"
      - name: Run conformance suite
        if: ${{ steps.check-backend.outputs.exists == 'true' }}
        run: |
          # TODO: Implement in T04 - placeholder
          echo "Conformance suite placeholder for ${{ matrix.backend }}"
      - name: Verify SQL matches spec/queries.sql
        if: ${{ steps.check-backend.outputs.exists == 'true' }}
        run: |
          # TODO: Implement - placeholder
          echo "SQL verification placeholder for ${{ matrix.backend }}"
      - name: Backend not implemented yet
        if: ${{ steps.check-backend.outputs.exists == 'false' }}
        run: |
          echo "Backend ${{ matrix.backend }} not implemented yet (no backends/${{ matrix.backend }}/Dockerfile) — skipping cleanly"
          exit 0
