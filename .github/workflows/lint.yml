name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@d6e534d5c1b8c8b8e5b8c5e8d8e8f8a8b8c8d8e8 # v19.0.0
        with:
          globs: |
            **/*.md
            !node_modules/**/*
            !.git/**/*

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@74d9e0c5e8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8 # v2.0.0
        with:
          scandir: .
          exclude: .git

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@c9b3e3c5e8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8 # v3.1.1
        with:
          config_file: .yamllint.yml